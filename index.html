<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Voice Generator</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222b;
      --field: #0f1419;
      --border: #2d3a47;
      --btn: #242f3a;
      --btn-hover: #2d3a47;
      --accent: #2f6fed;
      --accent-hover: #4a84f5;
      --text: #e8edf2;
      --muted: #8a97a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--panel);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 4px;
    }

    .subtitle {
      margin: 0 0 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      line-height: 1.5;
    }

    textarea:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin: 6px 2px 18px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
      margin-bottom: 20px;
    }

    .control.full { grid-column: 1 / -1; }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      font: inherit;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .value {
      float: right;
      color: var(--text);
    }

    .buttons {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
    }

    button {
      font: inherit;
      font-size: 1rem;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s ease, opacity 0.12s ease;
    }

    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }

    button:focus-visible {
      outline: 2px solid var(--accent-hover);
      outline-offset: 2px;
    }

    .status {
      min-height: 1.2em;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .status.error { color: #ff6b6b; }

    .voice-note {
      margin: 6px 2px 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .voice-note.warn { color: #ffb84d; }

    .unsupported {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 107, 107, 0.12);
      color: #ff6b6b;
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      .controls { grid-template-columns: 1fr; }
      .buttons { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Text to Voice Generator</h1>
    <p class="subtitle">Type or paste text, choose a voice, and listen.</p>

    <label for="text">Your text</label>
    <textarea id="text" dir="auto" placeholder="Type or paste the text you want to hear..."></textarea>
    <div class="meta">
      <span id="count">0 characters</span>
      <span id="words">0 words</span>
    </div>

    <div class="controls">
      <div class="control full">
        <label for="language">Language</label>
        <select id="language">
          <option value="en-US">English</option>
          <option value="ur-PK">Urdu (اردو)</option>
          <option value="de-DE">German (Deutsch)</option>
          <option value="es-ES">Spanish (Español)</option>
          <option value="fr-FR">French (Français)</option>
        </select>
      </div>

      <div class="control full">
        <label for="voice">Voice</label>
        <select id="voice"></select>
        <p class="voice-note" id="voiceNote"></p>
      </div>

      <div class="control">
        <label for="rate">Speed <span class="value" id="rateValue">1.0x</span></label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
      </div>

      <div class="control">
        <label for="pitch">Pitch <span class="value" id="pitchValue">1.0</span></label>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
      </div>

      <div class="control full">
        <label for="volume">Volume <span class="value" id="volumeValue">100%</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
      </div>
    </div>

    <div class="buttons">
      <button class="primary" id="play">▶ Play</button>
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <p class="status" id="status" role="status"></p>

    <div class="unsupported" id="unsupported">
      Your browser does not support speech synthesis. Try a recent version of Chrome, Edge, Safari, or Firefox.
    </div>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const textEl = $('text');
      const voiceEl = $('voice');
      const languageEl = $('language');
      const voiceNoteEl = $('voiceNote');
      const LANGUAGE_NAMES = {
        'en': 'English',
        'ur': 'Urdu',
        'de': 'German',
        'es': 'Spanish',
        'fr': 'French'
      };
      const rateEl = $('rate');
      const pitchEl = $('pitch');
      const volumeEl = $('volume');
      const playBtn = $('play');
      const pauseBtn = $('pause');
      const stopBtn = $('stop');
      const statusEl = $('status');

      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        $('unsupported').style.display = 'block';
        playBtn.disabled = true;
        return;
      }

      const synth = window.speechSynthesis;
      let voices = [];
      let queue = [];          // text chunks waiting to be spoken
      let currentIndex = 0;
      let state = 'idle';      // idle | playing | paused
      let activeUtter = null;  // only the current utterance may advance the queue

      // Long text can stop speaking in some browsers, so split it into sentence-sized chunks.
      // Includes Urdu full stop (۔) and question mark (؟) alongside Latin punctuation.
      function chunkText(text) {
        const sentences = text.match(/[^.!?۔؟]+[.!?۔؟]+["')\]]*\s*|[^.!?۔؟]+$/g) || [];
        const chunks = [];
        let buffer = '';
        for (const s of sentences) {
          if ((buffer + s).length > 200 && buffer) {
            chunks.push(buffer.trim());
            buffer = s;
          } else {
            buffer += s;
          }
        }
        if (buffer.trim()) chunks.push(buffer.trim());
        return chunks;
      }

      function currentLang() {
        return languageEl.value;                      // e.g. "ur-PK"
      }

      function currentPrefix() {
        return currentLang().split('-')[0].toLowerCase(); // e.g. "ur"
      }

      // Show only voices that match the selected language.
      // Option values are indices into the full `voices` list.
      function loadVoices() {
        const list = synth.getVoices();
        if (!list.length) return;
        voices = list;
        populateVoices();
      }

      function populateVoices() {
        const prefix = currentPrefix();
        const name = LANGUAGE_NAMES[prefix] || prefix;
        const matches = [];
        voices.forEach((v, i) => {
          if (v.lang && v.lang.toLowerCase().split(/[-_]/)[0] === prefix) matches.push(i);
        });

        voiceEl.innerHTML = '';
        if (matches.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = `No ${name} voice found on this device`;
          voiceEl.appendChild(opt);
          voiceEl.disabled = true;
          voiceNoteEl.classList.add('warn');
          voiceNoteEl.textContent = `Your device has no ${name} voice. Install one in your system's speech or language settings, or try another browser. Chrome and Edge often include more voices.`;
        } else {
          matches.forEach((i) => {
            const v = voices[i];
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${v.name} (${v.lang})${v.default ? ' – default' : ''}`;
            voiceEl.appendChild(opt);
          });
          voiceEl.disabled = false;
          voiceNoteEl.classList.remove('warn');
          voiceNoteEl.textContent = `${matches.length} ${name} voice${matches.length === 1 ? '' : 's'} available.`;
        }
        updateButtons();
      }

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', !!isError);
      }

      function updateButtons() {
        const hasText = textEl.value.trim().length > 0;
        const hasVoice = !voiceEl.disabled && voiceEl.value !== '';
        playBtn.disabled = state === 'playing' || !hasText || !hasVoice;
        playBtn.textContent = state === 'paused' ? '▶ Resume' : '▶ Play';
        pauseBtn.disabled = state !== 'playing';
        pauseBtn.textContent = 'Pause';
        stopBtn.disabled = state === 'idle';
      }

      function speakNext() {
        if (currentIndex >= queue.length) {
          state = 'idle';
          setStatus('Finished.');
          updateButtons();
          return;
        }

        const utter = new SpeechSynthesisUtterance(queue[currentIndex]);
        const voice = voices[Number(voiceEl.value)];
        if (voice) utter.voice = voice;
        utter.lang = currentLang();
        utter.rate = Number(rateEl.value);
        utter.pitch = Number(pitchEl.value);
        utter.volume = Number(volumeEl.value);

        utter.onstart = () => {
          setStatus(`Speaking… (${currentIndex + 1} of ${queue.length})`);
        };
        activeUtter = utter;
        utter.onend = () => {
          if (utter !== activeUtter || state !== 'playing') return;   // stale, stopped or paused
          currentIndex++;
          speakNext();
        };
        utter.onerror = (e) => {
          if (utter !== activeUtter) return;
          if (e.error === 'canceled' || e.error === 'interrupted') return;
          state = 'idle';
          setStatus('Speech could not be played: ' + e.error, true);
          updateButtons();
        };

        synth.speak(utter);
      }

      function play() {
        if (state === 'paused') {
          synth.resume();
          state = 'playing';
          setStatus('Speaking…');
          updateButtons();
          return;
        }

        const text = textEl.value.trim();
        if (!text) return;

        synth.cancel();
        queue = chunkText(text);
        currentIndex = 0;
        state = 'playing';
        updateButtons();
        speakNext();
      }

      function pause() {
        if (state !== 'playing') return;
        state = 'paused';
        synth.pause();
        setStatus('Paused.');
        updateButtons();
      }

      function stop() {
        state = 'idle';
        synth.cancel();
        queue = [];
        currentIndex = 0;
        setStatus('Stopped.');
        updateButtons();
      }

      // Live counters and slider labels
      function updateCounts() {
        const text = textEl.value;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        $('count').textContent = `${text.length} character${text.length === 1 ? '' : 's'}`;
        $('words').textContent = `${words} word${words === 1 ? '' : 's'}`;
      }

      function updateLabels() {
        $('rateValue').textContent = `${Number(rateEl.value).toFixed(1)}x`;
        $('pitchValue').textContent = Number(pitchEl.value).toFixed(1);
        $('volumeValue').textContent = `${Math.round(Number(volumeEl.value) * 100)}%`;
      }

      // Changing a setting mid-speech restarts from the current chunk with new settings
      function applySettingChange() {
        updateLabels();
        if (state === 'playing') {
          activeUtter = null;          // ignore events from the cancelled utterance
          synth.cancel();
          speakNext();                 // currentIndex is unchanged, so it restarts this chunk
        }
      }

      playBtn.addEventListener('click', play);
      pauseBtn.addEventListener('click', pause);
      stopBtn.addEventListener('click', stop);
      textEl.addEventListener('input', () => { updateCounts(); updateButtons(); });
      voiceEl.addEventListener('change', applySettingChange);
      languageEl.addEventListener('change', () => {
        // Stop any current speech, then reload voices for the new language
        if (state !== 'idle') stop();
        populateVoices();
        setStatus('');
      });
      rateEl.addEventListener('change', applySettingChange);
      pitchEl.addEventListener('change', applySettingChange);
      volumeEl.addEventListener('change', applySettingChange);
      rateEl.addEventListener('input', updateLabels);
      pitchEl.addEventListener('input', updateLabels);
      volumeEl.addEventListener('input', updateLabels);

      // Keyboard shortcut: Ctrl/Cmd + Enter to play
      textEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          play();
        }
      });

      synth.addEventListener('voiceschanged', loadVoices);
      loadVoices();
      updateCounts();
      updateLabels();
      updateButtons();
    })();
  </script>
</body>
</html>
